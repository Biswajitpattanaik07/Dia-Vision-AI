<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | DiaVision AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
tailwind.config = { darkMode: "class", theme: { extend: {
  colors: { "primary": "#d0bcff", "on-primary": "#3c0091", "on-surface-variant": "#cbc3d7",
            "secondary": "#4edea3", "error": "#ffb4ab", "surface-container-high": "#121212" },
  fontFamily: { "headline-md": ["Manrope"], "body-md": ["Inter"], "display-lg": ["Manrope"], "body-lg": ["Inter"], "label-sm": ["Inter"] },
  fontSize: {
    "headline-md": ["24px", {"lineHeight":"1.3","fontWeight":"600"}],
    "body-lg": ["18px", {"lineHeight":"1.6","fontWeight":"400"}],
    "body-md": ["16px", {"lineHeight":"1.5","fontWeight":"400"}],
    "label-sm": ["12px", {"lineHeight":"1","letterSpacing":"0.05em","fontWeight":"600"}]
  }
}}}
</script>
</head>
<body class="bg-black text-white font-body-md min-h-screen flex items-center justify-center p-6 overflow-x-hidden">
<main class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary/10 mb-4">
      <span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings:'FILL' 1;">visibility</span>
    </div>
    <h1 class="text-headline-md font-headline-md font-extrabold text-primary tracking-tight">DiaVision AI</h1>
    <p class="text-on-surface-variant mt-1">Create a new account</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="space-y-2 mb-6">
      {% for category, message in messages %}
        <div class="rounded-xl px-4 py-3 text-body-md border bg-error/10 border-error/30 text-error">{{ message }}</div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('register') }}" class="glass-card rounded-2xl p-8 shimmer-border space-y-5">
    <div class="space-y-2">
      <label class="text-label-sm text-on-surface-variant block ml-1">Full Name *</label>
      <input name="name" type="text" required placeholder="Dr. Jane Doe"
        class="w-full px-4 py-3 bg-surface-container-high border border-white/20 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">
    </div>
    <div class="space-y-2">
      <label class="text-label-sm text-on-surface-variant block ml-1">Email *</label>
      <input name="email" type="email" required placeholder="you@clinic.com"
        class="w-full px-4 py-3 bg-surface-container-high border border-white/20 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">
    </div>
    <div class="space-y-2">
      <label class="text-label-sm text-on-surface-variant block ml-1">Role / Specialty</label>
      <input name="role" type="text" placeholder="e.g. Ophthalmologist"
        class="w-full px-4 py-3 bg-surface-container-high border border-white/20 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">
    </div>
    <div class="space-y-2">
      <label class="text-label-sm text-on-surface-variant block ml-1">Password *</label>
      <div class="relative">
        <input id="reg-password" name="password" type="password" required minlength="8" placeholder="At least 8 characters"
          class="w-full px-4 pr-12 py-3 bg-surface-container-high border border-white/20 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">
        <button type="button" onclick="togglePasswordVisibility('reg-password', this)"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[20px]">visibility</span>
        </button>
      </div>
    </div>
    <div class="space-y-2">
      <label class="text-label-sm text-on-surface-variant block ml-1">Confirm Password *</label>
      <div class="relative">
        <input id="reg-confirm-password" name="confirm_password" type="password" required minlength="8"
          class="w-full px-4 pr-12 py-3 bg-surface-container-high border border-white/20 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">
        <button type="button" onclick="togglePasswordVisibility('reg-confirm-password', this)"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[20px]">visibility</span>
        </button>
      </div>
    </div>
    <button type="submit" class="w-full py-4 bg-primary text-on-primary font-bold rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
      Create Account
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </form>

  <p class="text-center text-label-sm text-on-surface-variant/60 mt-6">
    Already have an account? <a class="text-primary hover:underline" href="{{ url_for('login') }}">Sign in</a>
  </p>
</main>
<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script>
</body>
</html>
