<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">DiaVision AI</title>
  <desc id="d">Animated banner: DiaVision AI, explainable AI-assisted clinical image screening, with a scanning retina and a Grad-CAM heat spot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090513"/><stop offset="0.55" stop-color="#1a0f38"/><stop offset="1" stop-color="#07040f"/>
    </linearGradient>
    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#e9d5ff"/><stop offset="0.35" stop-color="#a78bfa"/><stop offset="0.7" stop-color="#22d3ee"/><stop offset="1" stop-color="#e9d5ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ecg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="retina" cx="0.45" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="0.55" stop-color="#c2410c"/><stop offset="1" stop-color="#5a1c0a"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6"/><stop offset="0.6" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0.95"/><stop offset="0.35" stop-color="#ffd000" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.85" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#a5f3fc" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="eye"><circle cx="985" cy="160" r="112"/></clipPath>
    <clipPath id="type"><rect x="60" y="150" height="44" width="650">
      <animate attributeName="width" values="0;650;650;0" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- drifting glows -->
  <circle cx="200" cy="60" r="150" fill="#6d28d9" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="200;320;200" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="290" r="160" fill="#0891b2" opacity="0.16" filter="url(#glow)">
    <animate attributeName="cx" values="1000;880;1000" dur="14s" repeatCount="indefinite"/></circle>

  <!-- floating particles -->
  <g fill="#c4b5fd">
    <circle cx="120" cy="260" r="2"><animate attributeName="cy" values="270;40;270" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="280" r="1.6"><animate attributeName="cy" values="290;60;290" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="250" r="2.2"><animate attributeName="cy" values="260;30;260" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="285" r="1.8"><animate attributeName="cy" values="295;50;295" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="13s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="58" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1" fill="url(#tg)">DiaVision AI</text>
  <text x="62" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#a78bfa" opacity="0.9">INTELLIGENCE SUITE</text>

  <!-- typing subtitle -->
  <g clip-path="url(#type)">
    <text x="60" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#e9d5ff">Explainable AI-assisted clinical image screening</text>
  </g>
  <rect x="60" y="156" width="3" height="30" fill="#22d3ee">
    <animate attributeName="x" values="60;710;710;60" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- tech chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ede9fe">
    <g><rect x="60" y="214" width="78" height="32" rx="16" fill="#7c3aed" fill-opacity="0.28" stroke="#8b5cf6"/><text x="99" y="235" text-anchor="middle">Flask</text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.143;0.429" dur="2.1s" begin="0s" fill="freeze"/></g>
    <g><rect x="150" y="214" width="118" height="32" rx="16" fill="#7c3aed" fill-opacity="0.28" stroke="#8b5cf6"/><text x="209" y="235" text-anchor="middle">TensorFlow</text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.286;0.571" dur="2.1s" begin="0s" fill="freeze"/></g>
    <g><rect x="280" y="214" width="108" height="32" rx="16" fill="#7c3aed" fill-opacity="0.28" stroke="#8b5cf6"/><text x="334" y="235" text-anchor="middle">Grad-CAM</text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.429;0.714" dur="2.1s" begin="0s" fill="freeze"/></g>
    <g><rect x="400" y="214" width="128" height="32" rx="16" fill="#7c3aed" fill-opacity="0.28" stroke="#8b5cf6"/><text x="464" y="235" text-anchor="middle">EfficientNet</text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;0.857" dur="2.1s" begin="0s" fill="freeze"/></g>
    <g><rect x="540" y="214" width="116" height="32" rx="16" fill="#7c3aed" fill-opacity="0.28" stroke="#8b5cf6"/><text x="598" y="235" text-anchor="middle">ReportLab</text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.714;1" dur="2.1s" begin="0s" fill="freeze"/></g>
  </g>

  <!-- retina with scan line and Grad-CAM heat spot -->
  <circle cx="985" cy="160" r="128" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 12" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 985 160" to="360 985 160" dur="30s" repeatCount="indefinite"/></circle>
  <circle cx="985" cy="160" r="120" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="116;126;116" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="985" cy="160" r="112" fill="url(#retina)"/>
  <g clip-path="url(#eye)">
    <g fill="none" stroke="#7f1d1d" stroke-linecap="round" opacity="0.75">
      <path d="M1040 150 C1010 120 980 100 940 90" stroke-width="3"/>
      <path d="M1040 150 C1005 150 970 140 920 150" stroke-width="3"/>
      <path d="M1040 150 C1010 185 980 205 935 215" stroke-width="3"/>
      <path d="M1040 150 C1030 110 1030 80 1050 55" stroke-width="2.5"/>
      <path d="M1040 150 C1035 190 1035 225 1052 258" stroke-width="2.5"/>
      <path d="M980 105 C965 120 950 125 930 124" stroke-width="1.6"/>
      <path d="M975 205 C960 195 945 192 925 196" stroke-width="1.6"/>
    </g>
    <circle cx="950" cy="165" r="14" fill="#7c2d12" opacity="0.55"/>
    <circle cx="1040" cy="150" r="24" fill="url(#disc)"/>
    <!-- Grad-CAM heat spot -->
    <circle cx="965" cy="205" r="30" fill="url(#heat)">
      <animate attributeName="r" values="24;40;24" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="925" cy="120" r="16" fill="url(#heat)" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <!-- scan line -->
    <rect x="860" y="30" width="250" height="46" fill="url(#scan)">
      <animate attributeName="y" values="30;250;30" dur="4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ECG pulse along the bottom -->
  <path d="M0 296 H230 L250 296 L262 270 L278 318 L292 286 L302 296 H620 L640 296 L652 272 L668 316 L682 288 L692 296 H1200"
        fill="none" stroke="url(#ecg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="140 860">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="4.5s" repeatCount="indefinite"/></path>
  <path d="M0 296 H230 L250 296 L262 270 L278 318 L292 286 L302 296 H620 L640 296 L652 272 L668 316 L682 288 L692 296 H1200"
        fill="none" stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
